name: Garmin Sync

on:
  # Der Stunden-Takt kommt aus Supabase (pg_cron, Migration 0015_sync_stuendlich.sql):
  # GitHubs eigener Zeitplan lief bei diesem Repo nicht zuverlässig.
  workflow_dispatch:
    inputs:
      trigger:
        description: "Auslöser (manual = Knopf in der App)"
        default: manual

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Sync
        working-directory: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WATCH_DAYS: ${{ vars.WATCH_DAYS || '7' }}
          SYNC_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || 'schedule' }}
        run: python sync.py
